[package]
name = "llama-server-loader"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
nix = { version = "0.29", features = ["signal", "process"] }
tui-input = "0.10"
nvml-wrapper = "0.12"
ansi-to-tui = "3"
